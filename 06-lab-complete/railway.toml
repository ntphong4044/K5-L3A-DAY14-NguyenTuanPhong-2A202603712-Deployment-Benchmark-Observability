# ============================================================
# Railway deploy config — build bằng Dockerfile, health check /health.
# App lắng nghe theo biến PORT do Railway cấp (xử lý trong CMD của Dockerfile).
# Đặt AGENT_API_KEY, REDIS_URL bằng biến môi trường trên Railway (không ghi ở đây).
# ============================================================
[build]
builder = "DOCKERFILE"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
