# ============================================================
# Render Blueprint — có thể dùng thay railway.toml.
# Secret (AGENT_API_KEY) dùng generateValue; REDIS_URL lấy từ service Redis.
# ============================================================
services:
  - type: web
    name: day14-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "30.0"
      # Secret: Render tự sinh, không ghi giá trị vào file
      - key: AGENT_API_KEY
        generateValue: true
      # Redis URL lấy từ service redis bên dưới
      - key: REDIS_URL
        fromService:
          type: redis
          name: day14-redis
          property: connectionString

  - type: redis
    name: day14-redis
    plan: free
    ipAllowList: []
