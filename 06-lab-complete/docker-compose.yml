# ============================================================
# Agent + Redis — chạy bằng: docker compose up --build
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=staging
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - RATE_LIMIT_PER_MINUTE=60
      - DAILY_BUDGET_USD=1.0
      - MONTHLY_BUDGET_USD=30.0
    # Secrets (AGENT_API_KEY...) nạp từ .env nếu có; không có file vẫn chạy được.
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
